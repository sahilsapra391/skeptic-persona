# Skeptic Wire — single Worker, single cron trigger (free plan allows 5/account).
# Deploy prerequisites (owner, one-time):
#   wrangler d1 create skeptic-wire        -> paste database_id below
#   wrangler kv namespace create STATE     -> paste id below
# Secrets are set with `wrangler secret put <NAME>` and are never committed.

name = "skeptic-persona"
main = "src/index.ts"
# Highest date supported by the pinned workerd (keeps local tests == deploy semantics).
compatibility_date = "2025-09-06"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "skeptic-wire"
database_id = "d951177f-e4ab-4b6b-a014-efc7d78d065e"

[[kv_namespaces]]
binding = "KV"
id = "87179e74d0ec417d8650ebdeaa01f377"

[vars]
# Goes into the User-Agent for polite polling (SEC/BLS require a declared contact).
CONTACT_EMAIL = "admin@spechawk.ai"
# Master gate for the poster. Set FALSE on 2026-07-28 when the Threads account
# was banned and the publish path was parked. This is defence in depth only —
# the real gate is THREADS_PARKED in src/poster.ts, which outranks this var
# precisely so that flipping this back to "true" cannot reach a dead API.
# Publishing is manual on X (@SkepticTrades); see docs/p2r-plan.md.
POSTING_ENABLED = "false"
# Owner's private chat; the only chat the approval bot listens to.
TELEGRAM_CHAT_ID = "6504147349"
# Bluesky discovery lane (p5-25). Owner supplied the handle and authorised the
# flip 2026-08-08. Declared HERE rather than as a secret because a public
# handle is config, and because Workers Builds re-applies [vars] on every merge
# deploy — a dashboard-only value would be silently reverted.
#
# The credential (BLUESKY_APP_PASSWORD) stays a Worker secret and is never in
# this file. Nothing this lane ingests can ever card: social is DISCOVERY, not
# citation, so every row lands at log-only score.
BLUESKY_IDENTIFIER = "skeptictrades.bsky.social"
BLUESKY_ENABLED = "true"
# Queue TTLs (owner decision 2026-08-01): manual posting means a card must
# survive a workday. Declared HERE (not the dashboard) because Workers Builds
# re-applies [vars] on every merge deploy. Overrides merge over code defaults.
QUEUE_TTL_HOURS = "48"
QUEUE_TTL_OVERRIDES = "MACRO_PRINT:12,HALT:12,CONGRESS_PTR:96"
# Generation model id (P2-R). Declared HERE because Workers Builds re-applies
# [vars] on every merge deploy — a dashboard-set value would be wiped. Empty =
# generation holds and the queue accumulates; the owner sets the real id in a
# PR alongside `wrangler secret put OPENROUTER_API_KEY`.
# Switched from qwen/qwen3.7-flash 2026-08-01 on measured evidence, not taste:
# docs/verification/2026-08-01-model-ab.md ran 4 real production items through
# the real prompt and the real doctrine validators against four models.
# gpt-5.6-terra: 10/12 drafts valid on 4,875 output tokens.
# qwen3.7-flash: 8/12 valid on 33,797 — ~7x the tokens for a worse pass rate.
# Model id verified against the live OpenRouter catalog the same day.
OPENROUTER_MODEL = "openai/gpt-5.6-terra"
