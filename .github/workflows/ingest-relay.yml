# Ingest relay for sources unreachable from Cloudflare Worker egress.
#
# WHY THIS EXISTS: five sources answer normally from a residential-class
# connection and fail from Workers, each differently — Senate eFD 403s
# datacenter IPs, NSE India resets on our declared UA, treasury.gov fails the
# TLS handshake (525) on two hosts, www.cftc.gov 403s.
#
# This workflow is a DUMB COURIER. It fetches bytes and POSTs them to the
# Worker's /ingest endpoint. Every piece of logic that matters — parsing,
# scoring, drafting, dedup, the approval queue — stays in the Worker, on code
# that is already tested. Nothing is reimplemented here, because a second
# implementation of the parser is the failure this design exists to avoid.
#
# ENABLED 2026-08-01 (p4-00): quota reset arrived, billing fixed, and the
# secret pair was live-verified end to end (run 30710041354: treasury + CFTC
# + house lanes returned 200 through the authenticated /ingest path).
name: ingest-relay

# TWO cadences, because the sources move at different speeds. Job-level `if`
# filters on which cron fired (github.event.schedule); a manual dispatch runs
# the chosen lane ("all" runs everything).
#
# The House lane costs ~1.5 min per run (checkout + pip + 20 sequential PDF
# downloads). On the 30-minute cadence that is ~530 min/month against a
# 2,000 min free tier, for a bulk index that rebuilds ONCE per weekday.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run (all | feeds | senate | house)"
        type: choice
        default: all
        options: [all, feeds, senate, house]
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # every 30 min, US market hours, weekdays
    - cron: "20 14 * * 1-5"        # House PDFs, after the ~13:00 UTC index rebuild
    # Senate eFD, UNPARKED 2026-08-06. Three weekday attempts rather than a
    # frequent poll, because the constraint is not our cadence: the eFD data
    # endpoint goes into the Senate's OWN maintenance for hours at a time
    # (measured up at 05:15Z and down at 13:45Z on the same day), and volume is
    # ~12 filings a week. Spread attempts catch a window; a tight loop just
    # burns account-wide Actions minutes against a 503.
    - cron: "0 5,11,17 * * 1-5"

concurrency:
  group: ingest-relay
  cancel-in-progress: false

jobs:
  relay:
    # Every scheduled cadence EXCEPT the daily House slot; on manual dispatch,
    # only when the chosen lane includes it.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '20 14 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","feeds"]'), inputs.lane))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: treasury_auction
            url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query?sort=-auction_date&page%5Bsize%5D=12"
          - source: press_cftc_enforcement
            url: "https://www.cftc.gov/RSS/RSSENF/rssenf.xml"
    steps:
      - name: Fetch ${{ matrix.source }}
        id: fetch
        run: |
          set -euo pipefail
          # Declared UA, same as the Worker. We identify honestly here too —
          # the point of this lane is the network path, not disguise.
          code=$(curl -sS -L --max-time 60 \
            -A "Skeptic Wire admin@spechawk.ai" \
            -o body.txt -w "%{http_code}" "${{ matrix.url }}")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < body.txt)" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.source }} returned $code"
            exit 1
          fi

      - name: Relay to Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          # jq -Rs slurps the body as a single JSON string, so any quoting,
          # newlines or control characters in the payload survive intact.
          jq -Rs --arg source "${{ matrix.source }}" \
                 --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 '{source: $source, fetchedAt: $fetchedAt, body: .}' \
                 body.txt > payload.json
          code=$(curl -sS --max-time 60 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Secret: ${INGEST_SECRET}" \
            --data-binary @payload.json \
            -o relay-response.json -w "%{http_code}" \
            "${WORKER_URL}/ingest")
          cat relay-response.json
          if [ "$code" != "200" ]; then
            echo "::error::relay returned $code"
            exit 1
          fi

  # Senate eFD needs a session handshake, a search POST, and one detail page
  # per filing — none of which the Worker can reach. The courier does all
  # three and delivers a bundle; the Worker parses it with the same code the
  # direct poller uses.
  senate:
    # UNPARKED 2026-08-06 after measuring all three egress classes in one
    # 15-minute window (docs/verification/2026-08-06-senate-egress-three-ways.md):
    #
    #   GET /search/home/       Worker 403 | runner 200 | residential 200
    #   POST /search/report/data/  runner 503 | residential 503 (4/4)
    #
    # Two DIFFERENT failures, and the 2026-08-01 note conflated them. The
    # Worker is genuinely blocked at the home page, which is why senate_ptr
    # cannot work from the Worker at all. The 503 is NOT bot mitigation: the
    # body is the Senate's own "WEBSITE TEMPORARILY UNAVAILABLE DUE TO
    # MAINTENANCE" page with no Ray ID and no vendor markers, and it hits a
    # residential client identically. It is also INTERMITTENT — the same
    # residential client got 200 with 12 real rows, 27/27, at 05:15Z the same
    # morning.
    #
    # So runners DO reach eFD, and this lane is the honest network path. It
    # now runs on a schedule; a maintenance window is a SOFT SKIP, not a red
    # run, because a workflow that reds three times a day on someone else's
    # planned downtime is a workflow everyone learns to ignore.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5,11,17 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","senate"]'), inputs.lane))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Handshake, search, and fetch detail pages
        run: |
          set -euo pipefail
          UA="Skeptic Wire admin@spechawk.ai"
          BASE="https://efdsearch.senate.gov"
          JAR=$(mktemp)

          # Step 1: home page sets csrftoken + LB cookies and carries a HIDDEN
          # csrfmiddlewaretoken whose value DIFFERS from the cookie.
          HOME_CODE=$(curl -sS -L --max-time 60 -A "$UA" -c "$JAR" \
            "$BASE/search/home/" -o home.html -w "%{http_code}")
          # `|| true`: under pipefail a block page with no token would kill
          # this assignment and skip the diagnostic below (review finding).
          HIDDEN=$(grep -o 'name="csrfmiddlewaretoken" value="[^"]*"' home.html \
            | head -1 | sed 's/.*value="//;s/"//' || true)
          if [ -z "$HIDDEN" ]; then
            echo "::error::no csrfmiddlewaretoken (home=$HOME_CODE, $(wc -c < home.html) bytes); first bytes: $(head -c 200 home.html | tr -cd '[:print:]')"
            exit 1
          fi

          # Step 2: accept the prohibition agreement to get a session.
          #
          # AUTHORIZED by the owner 2026-08-06 and conditioned in
          # docs/DATA_USE_POLICY.md: free public dissemination with
          # attribution, never for credit determination, solicitation or
          # resale, the same fence over the House lane, and a paid feature
          # stops the line for legal review before any build. Accepting terms
          # on the owner's behalf is his decision, not a task instruction, and
          # this is the record that he made it.
          #
          # Django
          # answers the POST with a 302; FOLLOW it (-L) so any session cookie
          # set on the redirect target lands in the jar too — without this the
          # first live run got search=503 on what may have been a sessionless
          # request.
          AGREE_CODE=$(curl -sS -L --max-time 60 -A "$UA" -b "$JAR" -c "$JAR" \
            -X POST "$BASE/search/home/" \
            -H "Referer: $BASE/search/home/" \
            --data "prohibition_agreement=1&csrfmiddlewaretoken=${HIDDEN}" \
            -o /dev/null -w "%{http_code} -> %{url_effective}")

          CSRF=$(awk '$6=="csrftoken"{print $7}' "$JAR" | tail -1)

          # Step 3: the search endpoint returns {result:"ok", data:[[...]]}.
          SEARCH_CODE=$(curl -sS --max-time 60 -A "$UA" -b "$JAR" \
            -X POST "$BASE/search/report/data/" \
            -H "Referer: $BASE/search/" \
            -H "X-CSRFToken: ${CSRF}" \
            -H "X-Requested-With: XMLHttpRequest" \
            --data "start=0&length=25&report_types=[11]&filer_types=[]&submitted_start_date=&submitted_end_date=&candidate_state=&senator_state=&office_id=&first_name=&last_name=" \
            -o search.json -w "%{http_code}")

          # Diagnostics BEFORE parsing. RE-TESTED 2026-08-02 from a
          # RESIDENTIAL connection with the same declared UA: byte-for-byte
          # the same failure, so this is NOT the Azure IP class and the
          # "owner-run residential courier" unlock would not have worked.
          #
          # The 411 above is a curl artifact -- following the 302 as a POST
          # with no body. Without -L the agreement returns 302 with a valid
          # sessionid, and GET /search/ then answers 200. Only the XHR data
          # endpoint 503s, and its body is the Senate's OWN maintenance
          # notice, not a bot-mitigation page: no Ray ID, no vendor markers.
          #
          # So the lane is parked on UNVERIFIED, not on IP-blocked. The test
          # is a weekday retry of this same dispatch.
          # See docs/verification/2026-08-02-senate-efd-retest.md.
          echo "senate: home=$HOME_CODE agree=$AGREE_CODE search=$SEARCH_CODE bytes=$(wc -c < search.json)" >> "$GITHUB_STEP_SUMMARY"

          # SOFT SKIP on the Senate's own maintenance page. Distinguished by
          # its body, not by the status code alone: a 503 that is NOT the
          # maintenance notice is something we have never seen and must stay
          # loud. Matching on the Senate's own words is the narrowest test
          # available, and it is checked against the body we captured on
          # 2026-08-06 rather than guessed.
          if [ "$SEARCH_CODE" = "503" ] && grep -qi "UNDER MAINTENANCE\|TEMPORARILY UNAVAILABLE" search.json; then
            echo "senate: eFD in scheduled maintenance; skipping this run" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::senate eFD returned its maintenance page (503). Not a failure; the next slot retries."
            exit 0
          fi
          if ! jq -e '.result' search.json >/dev/null 2>&1; then
            echo "::error::senate search returned non-JSON (home=$HOME_CODE agree=$AGREE_CODE search=$SEARCH_CODE); first bytes: $(head -c 300 search.json | tr -cd '[:print:]')"
            exit 1
          fi

          # Step 4: one detail page per electronic filing. Sequential and
          # rate-limited on purpose — this is somebody's disclosure system,
          # not a scraping target.
          jq -r '.data[]? | .[3]' search.json \
            | grep -o '/search/view/ptr/[0-9a-f-]\{36\}/' \
            | sed 's|/search/view/ptr/||;s|/||' > uuids.txt || true
          echo '{}' > details.json
          while read -r uuid; do
            [ -z "$uuid" ] && continue
            curl -sS --max-time 45 -A "$UA" -b "$JAR" \
              "$BASE/search/view/ptr/${uuid}/" -o detail.html || continue
            jq --arg k "$uuid" --rawfile v detail.html \
               '. + {($k): $v}' details.json > details.tmp && mv details.tmp details.json
            sleep 1
          done < uuids.txt

          jq -n --slurpfile s search.json --slurpfile d details.json \
            '{search: $s[0], details: $d[0]}' > bundle.json
          echo "rows=$(jq '.data | length' search.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "details=$(jq 'length' details.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Relay to Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          jq -Rs --arg source "senate_ptr" \
                 --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 '{source: $source, fetchedAt: $fetchedAt, body: .}' \
                 bundle.json > payload.json
          code=$(curl -sS --max-time 60 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Secret: ${INGEST_SECRET}" \
            --data-binary @payload.json \
            -o relay-response.json -w "%{http_code}" \
            "${WORKER_URL}/ingest")
          cat relay-response.json
          if [ "$code" != "200" ]; then echo "::error::relay returned $code"; exit 1; fi

  # House Clerk PTR PDFs. The Worker indexes WHO filed and WHEN from the bulk
  # ZIP, but the transactions live only in per-filing PDFs that are
  # RC4-encrypted with an EMPTY owner password and need a real PDF library to
  # read. That is not a 10ms regex job and there are no npm deps in the
  # Worker, so the extraction runs here.
  #
  # This job still carries no parsing logic: pypdf turns bytes into text and
  # the Worker's tested parser turns text into transactions. The Worker also
  # decides which documents to fetch, so the courier holds no state.
  house:
    # Daily slot only; on manual dispatch, only when the chosen lane includes it.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '20 14 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","house"]'), inputs.lane))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The only job that needs the repo: it runs our extractor script.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pypdf
        run: pip install --quiet "pypdf[crypto]==5.1.0"

      - name: Ask the Worker which documents it still needs
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 60 \
            -H "X-Ingest-Secret: ${INGEST_SECRET}" \
            -o pending.json -w "%{http_code}" \
            "${WORKER_URL}/ingest/pending/house_ptr")
          if [ "$code" != "200" ]; then
            echo "::error::pending returned $code"; cat pending.json; exit 1
          fi
          echo "pending=$(jq '.docs | length' pending.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download and extract
        run: |
          set -euo pipefail
          UA="Skeptic Wire admin@spechawk.ai"
          mkdir -p pdfs
          # Sequential and rate-limited: this is a disclosure system, not a
          # scraping target. The Worker caps the list, so this is bounded.
          jq -r '.docs[] | [.docId, .url] | @tsv' pending.json > work.tsv
          while IFS=$'\t' read -r docId url; do
            [ -z "$docId" ] && continue
            # -f: a 404 error PAGE must not be written as if it were a PDF.
            # A missing file is reported to the Worker by the extractor, which
            # is what makes the retry counter advance.
            curl -fsS -L --max-time 60 -A "$UA" -o "pdfs/${docId}.pdf" "$url" || {
              echo "::warning::download failed for ${docId}"; rm -f "pdfs/${docId}.pdf"; }
            sleep 1
          done < work.tsv
          python3 scripts/extract_house_pdfs.py pending.json pdfs bundle.json
          echo "reported=$(jq '.docs | length' bundle.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "withText=$(jq '[.docs[] | select(.text != "")] | length' bundle.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Relay to Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          # No documents OFFERED is a normal quiet day. Documents offered but
          # unreadable still relay, so the Worker counts the attempt.
          if [ "$(jq '.docs | length' bundle.json)" = "0" ]; then
            echo "no documents pending; nothing to relay"; exit 0
          fi
          jq -Rs --arg source "house_ptr" \
                 --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 '{source: $source, fetchedAt: $fetchedAt, body: .}' \
                 bundle.json > payload.json
          code=$(curl -sS --max-time 120 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Secret: ${INGEST_SECRET}" \
            --data-binary @payload.json \
            -o relay-response.json -w "%{http_code}" \
            "${WORKER_URL}/ingest")
          cat relay-response.json
          if [ "$code" != "200" ]; then echo "::error::relay returned $code"; exit 1; fi
