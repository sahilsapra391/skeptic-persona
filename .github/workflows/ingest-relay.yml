# Ingest relay for sources unreachable from Cloudflare Worker egress.
#
# WHY THIS EXISTS: five sources answer normally from a residential-class
# connection and fail from Workers, each differently — Senate eFD 403s
# datacenter IPs, NSE India resets on our declared UA, treasury.gov fails the
# TLS handshake (525) on two hosts, www.cftc.gov 403s.
#
# This workflow is a DUMB COURIER. It fetches bytes and POSTs them to the
# Worker's /ingest endpoint. Every piece of logic that matters — parsing,
# scoring, drafting, dedup, the approval queue — stays in the Worker, on code
# that is already tested. Nothing is reimplemented here, because a second
# implementation of the parser is the failure this design exists to avoid.
#
# Currently DISABLED (schedule commented out): the Actions quota is exhausted
# until 2026-08-01. Enable by uncommenting the schedule.
name: ingest-relay

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/30 13-21 * * 1-5"   # every 30 min, US market hours, weekdays

concurrency:
  group: ingest-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: treasury_auction
            url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query?sort=-auction_date&page%5Bsize%5D=12"
          - source: press_cftc_enforcement
            url: "https://www.cftc.gov/RSS/RSSENF/rssenf.xml"
    steps:
      - name: Fetch ${{ matrix.source }}
        id: fetch
        run: |
          set -euo pipefail
          # Declared UA, same as the Worker. We identify honestly here too —
          # the point of this lane is the network path, not disguise.
          code=$(curl -sS -L --max-time 60 \
            -A "Skeptic Wire admin@spechawk.ai" \
            -o body.txt -w "%{http_code}" "${{ matrix.url }}")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < body.txt)" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.source }} returned $code"
            exit 1
          fi

      - name: Relay to Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          # jq -Rs slurps the body as a single JSON string, so any quoting,
          # newlines or control characters in the payload survive intact.
          jq -Rs --arg source "${{ matrix.source }}" \
                 --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 '{source: $source, fetchedAt: $fetchedAt, body: .}' \
                 body.txt > payload.json
          code=$(curl -sS --max-time 60 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Secret: ${INGEST_SECRET}" \
            --data-binary @payload.json \
            -o relay-response.json -w "%{http_code}" \
            "${WORKER_URL}/ingest")
          cat relay-response.json
          if [ "$code" != "200" ]; then
            echo "::error::relay returned $code"
            exit 1
          fi

  # Senate eFD needs a session handshake, a search POST, and one detail page
  # per filing — none of which the Worker can reach. The courier does all
  # three and delivers a bundle; the Worker parses it with the same code the
  # direct poller uses.
  senate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Handshake, search, and fetch detail pages
        run: |
          set -euo pipefail
          UA="Skeptic Wire admin@spechawk.ai"
          BASE="https://efdsearch.senate.gov"
          JAR=$(mktemp)

          # Step 1: home page sets csrftoken + LB cookies and carries a HIDDEN
          # csrfmiddlewaretoken whose value DIFFERS from the cookie.
          curl -sS -L --max-time 60 -A "$UA" -c "$JAR" \
            "$BASE/search/home/" -o home.html
          HIDDEN=$(grep -o 'name="csrfmiddlewaretoken" value="[^"]*"' home.html \
            | head -1 | sed 's/.*value="//;s/"//')
          if [ -z "$HIDDEN" ]; then echo "::error::no csrfmiddlewaretoken"; exit 1; fi

          # Step 2: accept the prohibition agreement to get a session.
          curl -sS --max-time 60 -A "$UA" -b "$JAR" -c "$JAR" \
            -X POST "$BASE/search/home/" \
            -H "Referer: $BASE/search/home/" \
            --data "prohibition_agreement=1&csrfmiddlewaretoken=${HIDDEN}" \
            -o /dev/null

          CSRF=$(awk '$6=="csrftoken"{print $7}' "$JAR" | tail -1)

          # Step 3: the search endpoint returns {result:"ok", data:[[...]]}.
          curl -sS --max-time 60 -A "$UA" -b "$JAR" \
            -X POST "$BASE/search/report/data/" \
            -H "Referer: $BASE/search/" \
            -H "X-CSRFToken: ${CSRF}" \
            -H "X-Requested-With: XMLHttpRequest" \
            --data "start=0&length=25&report_types=[11]&filer_types=[]&submitted_start_date=&submitted_end_date=&candidate_state=&senator_state=&office_id=&first_name=&last_name=" \
            -o search.json

          # Step 4: one detail page per electronic filing. Sequential and
          # rate-limited on purpose — this is somebody's disclosure system,
          # not a scraping target.
          jq -r '.data[]? | .[3]' search.json \
            | grep -o '/search/view/ptr/[0-9a-f-]\{36\}/' \
            | sed 's|/search/view/ptr/||;s|/||' > uuids.txt || true
          echo '{}' > details.json
          while read -r uuid; do
            [ -z "$uuid" ] && continue
            curl -sS --max-time 45 -A "$UA" -b "$JAR" \
              "$BASE/search/view/ptr/${uuid}/" -o detail.html || continue
            jq --arg k "$uuid" --rawfile v detail.html \
               '. + {($k): $v}' details.json > details.tmp && mv details.tmp details.json
            sleep 1
          done < uuids.txt

          jq -n --slurpfile s search.json --slurpfile d details.json \
            '{search: $s[0], details: $d[0]}' > bundle.json
          echo "rows=$(jq '.data | length' search.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "details=$(jq 'length' details.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Relay to Worker
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          jq -Rs --arg source "senate_ptr" \
                 --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 '{source: $source, fetchedAt: $fetchedAt, body: .}' \
                 bundle.json > payload.json
          code=$(curl -sS --max-time 60 -X POST \
            -H "Content-Type: application/json" \
            -H "X-Ingest-Secret: ${INGEST_SECRET}" \
            --data-binary @payload.json \
            -o relay-response.json -w "%{http_code}" \
            "${WORKER_URL}/ingest")
          cat relay-response.json
          if [ "$code" != "200" ]; then echo "::error::relay returned $code"; exit 1; fi
