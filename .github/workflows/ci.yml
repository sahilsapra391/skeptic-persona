name: CI

# PRs only: the post-merge push run re-tested a commit that already passed
# on its branch — pure Actions-minutes burn (private-repo minutes are
# account-wide and shared with every other private repo).
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
