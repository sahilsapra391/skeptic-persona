# 13F-03: one-shot watchlist backfill (periods 2025-12-31 and 2026-03-31).
#
# DUMB COURIER, by doctrine: this job fetches bytes from EDGAR and forwards
# them untouched to the Worker's /ingest, where parseAndStore13f — the same
# single implementation the live poll uses — does ALL parsing, sanity-gating
# and diffing. The courier's only judgement is a filed-date window; the Worker
# stores the period primary_doc itself states, so a mis-windowed POST costs a
# no-op, never a wrong row.
#
# workflow_dispatch ONLY. Re-running is safe end to end: the Worker no-ops on
# already-parsed accessions.
name: thirteenf-backfill
on:
  workflow_dispatch:
    inputs:
      filed_from:
        description: "Earliest filed date to forward (covers Q4-2025 + Q1-2026 periods)"
        default: "2026-01-01"
      filed_to:
        description: "Latest filed date to forward"
        default: "2026-06-30"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch watchlist filings and forward to /ingest
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          FILED_FROM: ${{ inputs.filed_from }}
          FILED_TO: ${{ inputs.filed_to }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request

          UA = {"User-Agent": "SkepticWire/1.0 (admin@spechawk.ai)"}
          WORKER = os.environ["WORKER_URL"].rstrip("/")
          SECRET = os.environ["INGEST_SECRET"]
          F_FROM, F_TO = os.environ["FILED_FROM"], os.environ["FILED_TO"]

          def get(url, tries=3):
              for i in range(tries):
                  try:
                      rq = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(rq, timeout=40) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception:
                      if i == tries - 1:
                          raise
                      time.sleep(2.0 * (i + 1))

          # The watchlist comes from the seed migration in THIS checkout —
          # one source of truth, no second list to drift.
          seed = open("migrations/0061_managers13f_seed.sql").read()
          ciks = re.findall(r"\('(\d+)',", seed)
          print(f"watchlist ciks: {len(ciks)}")

          forwarded = skipped = failed = 0
          for cik in ciks:
              time.sleep(0.6)
              atom = get(
                  "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany"
                  f"&CIK={cik}&type=13F-HR&dateb=&owner=include&count=12&output=atom"
              )
              entries = re.findall(
                  r"<accession-n\w*>([\d-]+)</accession-n\w*>.*?<filing-date>([\d-]+)</filing-date>.*?<filing-type>([^<]+)</filing-type>",
                  atom, re.S,
              )
              for acc, fdate, ftype in entries:
                  if not (F_FROM <= fdate <= F_TO) or ftype not in ("13F-HR", "13F-HR/A"):
                      continue
                  nod = acc.replace("-", "")
                  base = f"https://www.sec.gov/Archives/edgar/data/{cik}/{nod}"
                  try:
                      time.sleep(0.6)
                      idx = json.loads(get(f"{base}/index.json"))
                      xmls = [it for it in idx["directory"]["item"] if it["name"].lower().endswith(".xml")]
                      pri = next(x["name"] for x in xmls if "primary_doc" in x["name"].lower())
                      tbl = max((x for x in xmls if x["name"] != pri), key=lambda x: int(x.get("size") or 0))
                      time.sleep(0.6)
                      primary = get(f"{base}/{pri}")
                      time.sleep(0.6)
                      table = get(f"{base}/{tbl['name']}")
                      body = json.dumps({
                          "cik": cik, "accession": acc, "form": ftype,
                          "filed_at": f"{fdate}T00:00:00.000Z",
                          "primary_doc": primary, "infotable": table,
                      })
                      rq = urllib.request.Request(
                          f"{WORKER}/ingest",
                          data=json.dumps({"source": "13f_backfill", "body": body}).encode(),
                          headers={"Content-Type": "application/json", "X-Ingest-Secret": SECRET},
                      )
                      with urllib.request.urlopen(rq, timeout=60) as r:
                          if r.status == 200:
                              forwarded += 1
                          else:
                              failed += 1
                  except Exception as e:
                      failed += 1
                      print(f"::warning::{cik} {acc}: {str(e)[:120]}")
              else:
                  skipped += 0
          print(f"forwarded={forwarded} failed={failed}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"13F backfill: forwarded={forwarded} failed={failed}\n")
          if failed > 0 and forwarded == 0:
              raise SystemExit(1)
          PY
